import java.util.Properties

plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Resolve the Google Maps API key from (in order): shell env, android/local.properties,
// or the Flutter project's ../.env. Accepts both GOOGLE_MAPS_API_KEY and MAPS_API_KEY.
def loadPropertiesFile = { File file ->
    def props = new Properties()
    if (file.exists()) {
        file.withInputStream { props.load(it) }
    }
    return props
}

def localProperties = loadPropertiesFile(rootProject.file("local.properties"))
def dotenvProperties = loadPropertiesFile(rootProject.file("../.env"))
def mapsApiKey = System.getenv("GOOGLE_MAPS_API_KEY")
        ?: localProperties.getProperty("GOOGLE_MAPS_API_KEY")
        ?: dotenvProperties.getProperty("GOOGLE_MAPS_API_KEY")
        ?: System.getenv("MAPS_API_KEY")
        ?: localProperties.getProperty("MAPS_API_KEY")
        ?: dotenvProperties.getProperty("MAPS_API_KEY")
        ?: ""

android {
    namespace = "com.example.hello"
    compileSdk = 36
    ndkVersion = "27.3.13750724"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = 21
    }

    defaultConfig {
        applicationId = "com.example.hello"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders += [GOOGLE_MAPS_API_KEY: mapsApiKey]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            // Fallback to debug signing only when key.properties is not configured yet.
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
