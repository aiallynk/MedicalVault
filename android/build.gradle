// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Must be >= 2.0.0 (Flutter's minimum) and match the KGP version declared
    // in settings.gradle (org.jetbrains.kotlin.android 2.1.20).
    ext.kotlin_version = '2.1.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Update this line to the latest version of the Android Gradle Plugin (AGP).
        // AGP 8.3.2 is compatible with Gradle 8.5, which supports Java 21.
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def resolveNamespaceFor(Project project) {
    def manifestFile = project.file("src/main/AndroidManifest.xml")
    if (manifestFile.exists()) {
        def matcher = manifestFile.getText("UTF-8") =~ /package\s*=\s*"([^"]+)"/
        if (matcher.find()) {
            return matcher.group(1)
        }
    }

    def groupValue = project.group?.toString()
    if (groupValue != null && !groupValue.trim().isEmpty() && groupValue != "unspecified") {
        return groupValue
    }

    return "com.example.${project.name.replace('-', '_')}"
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    afterEvaluate {
        if (project.hasProperty('android')) {
            android {
                if (hasProperty("namespace") &&
                        (namespace == null || namespace.toString().trim().isEmpty())) {
                    namespace resolveNamespaceFor(project)
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
