// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Keep these aligned with the plugin versions declared in settings.gradle.
    ext.kotlin_version = '2.3.10'
    ext.android_gradle_plugin_version = '8.12.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$android_gradle_plugin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def resolveNamespaceFor(Project project) {
    def manifestFile = project.file("src/main/AndroidManifest.xml")
    if (manifestFile.exists()) {
        def matcher = manifestFile.getText("UTF-8") =~ /package\s*=\s*"([^"]+)"/
        if (matcher.find()) {
            return matcher.group(1)
        }
    }

    def groupValue = project.group?.toString()
    if (groupValue != null && !groupValue.trim().isEmpty() && groupValue != "unspecified") {
        return groupValue
    }

    return "com.example.${project.name.replace('-', '_')}"
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    afterEvaluate {
        if (project.hasProperty('android')) {
            android {
                if (hasProperty("namespace") &&
                        (namespace == null || namespace.toString().trim().isEmpty())) {
                    namespace resolveNamespaceFor(project)
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
