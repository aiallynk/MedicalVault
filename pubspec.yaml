name: hello
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.23+25


environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  uuid: ^4.4.2
  path_provider: ^2.1.4
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  mongo_dart: 0.10.5
  open_file: ^3.3.2
  syncfusion_flutter_pdfviewer: ^31.1.21
  path: ^1.9.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  lottie: ^2.6.0
  http: ^1.1.0
  http_parser: ^4.0.1
  url_launcher: ^6.1.10
  dio: ^5.2.0
  crypto: ^3.0.6
  # 11.x removed the Android v1 embedding (registerWith(PluginRegistry.Registrar))
  # which no longer compiles on Flutter 3.44+. 10.x pulled permission_handler_android
  # 10.3.6 whose PermissionHandlerPlugin.java still referenced the removed Registrar.
  permission_handler: ^11.4.0
  cupertino_icons: ^1.0.5
  provider: ^6.1.4
  android_package_installer:
    path: local_plugins/android_package_installer
  package_info_plus: ^8.3.1
  firebase_messaging: ^16.0.2
  firebase_core: ^4.1.1
  googleapis_auth: ^2.0.0
  flutter_svg: ^2.0.10+1
  google_sign_in: ^6.1.4
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  # 8.x fixes const FontWeight map keys that fail to compile on Flutter 3.44+
  # (6.3.0 broke `flutter test`: "FontWeight does not have a primitive operator '=='").
  google_fonts: ^8.1.0
  web_socket_channel: ^3.0.3
  timezone: ^0.10.1
  connectivity_plus: ^6.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  workmanager: ^0.6.0
  google_maps_flutter: ^2.12.3
  flutter_dotenv: ^6.0.1
  flutter_markdown_plus: ^1.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/UploadDocument.png
    - assets/PickFromCamera.png
    - assets/Reports.png
    - assets/Prescription.png
    - assets/2851468.png
    - assets/Insurance12.png
    - assets/AiAllyLogo.png
    - assets/BloodReport.png
    - assets/HospitalBill.png
    - assets/app_icon.png
    - assets/icon/app_icon.png
    - assets/icon/medical_vault_logo.svg
    - assets/LoadingClock.json
    - assets/twodotloading.json
    - assets/Theme.png
    - assets/WelcomeLightTheme.svg
    - assets/WelcomeDarkTheme.svg
    - assets/NewWelcomeScreen.svg
    - assets/AiAllyLogoWhite.png
    - assets/Toogle.json
    - assets/chatbot.json
    - .env

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
